name: CI

permissions:
  content: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend: 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps: 
      - name: check out code
        uses: actions/checkout@v6

      - name: set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      
      - name: install
        run: cd backend && npm ci

      - name: run lint
        run: cd backend && npm run lint

      - name: run tests
        run: cd backend && npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: check out code
        uses: actions/checkout@v6

      - name: set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: run lint
        run: npm run lint
      
      - name: run build
        run: npm run build
